name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble release files
        run: |
          mkdir release
          cp get_con.cmd release/get_con.cmd
          cp get_win.cmd release/get_win.cmd
          cp pyconfig.json release/pyconfig.json.example
          cp requirements.txt release/requirements.txt.example
          ls -la release

      - name: Create zip
        run: |
          cd release
          zip -r "../localpython_installer-${GITHUB_REF_NAME}.zip" .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "localpython_installer-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" \
            "localpython_installer-${GITHUB_REF_NAME}.zip" \
            --clobber
